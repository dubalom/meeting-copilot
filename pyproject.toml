[project]
name = "meeting-copilot"
version = "0.1.0"
description = "Real-time meeting copilot: listens to system audio + mic, transcribes, and shows Claude's answers in an overlay."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # audio (step 1)
    "sounddevice>=0.5",
    "numpy>=1.26",
    "scipy>=1.12",
    # server (step 2)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
    # answers (step 3)
    "anthropic>=0.40",
    # meeting prep uploads (PDF text)
    "pypdf>=4.0",
    # logging
    "structlog>=24.1",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.1"]
# Optional local STT fallback
whisper = ["faster-whisper>=1.0"]
# Windows-only WASAPI loopback (installed automatically on Windows)
win = ["pyaudiowpatch>=0.2.12; sys_platform == 'win32'"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
copilot = "copilot.__main__:main"
copilot-devices = "copilot.audio.devices:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
