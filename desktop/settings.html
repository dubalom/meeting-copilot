<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Настройки — Meeting Copilot</title>
  <style>
    body { margin: 0; padding: 26px 28px; background: #0d1321; color: #e8edf6;
           font: 14px/1.5 "Onest", -apple-system, "Segoe UI", Roboto, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { color: #8d9ab2; margin: 0 0 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid #253147;
            background: #131b2b; color: inherit; font: inherit; outline: none; }
    input:focus { border-color: #44ddb2; }
    button { margin-top: 12px; padding: 10px 18px; border-radius: 10px; border: 0; background: #44ddb2; color: #052b20;
             font: inherit; font-weight: 700; cursor: pointer; }
    .err { color: #ffb3b3; min-height: 1.4em; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 13px; }
    td { padding: 5px 0; border-bottom: 1px solid #1e283b; }
    td:last-child { text-align: right; color: #c7d2e3; font-family: "JetBrains Mono", Menlo, Consolas, monospace; }
    .warn { color: #f5b84b; font-size: 12.5px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Подключение</h1>
  <p>Вставьте ссылку на копилот с токеном — её печатает <code>deploy/push.sh</code> или <code>python -m copilot serve</code>.</p>
  <form id="f">
    <label for="url">Ссылка</label>
    <input id="url" placeholder="https://saydarai.app/?token=…" autocomplete="off" spellcheck="false">
    <button type="submit">Сохранить и открыть</button>
    <div class="err" id="err"></div>
  </form>
  <table id="keys"></table>
  <div class="warn" id="warn" hidden></div>
  <script src="settings.js"></script>
</body>
</html>
